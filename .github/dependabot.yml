# Atualização automática de dependências.
#
# Complementa o `npm audit` do workflow: o audit avisa que existe problema, o
# Dependabot abre o PR com a correção já feita. Semanal em vez de diário porque
# o projeto tem um mantenedor só — PR demais vira PR ignorado.
version: 2
updates:
  - package-ecosystem: npm
    directory: /admin
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(painel)

  - package-ecosystem: npm
    directory: /firebase/functions
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(functions)

  - package-ecosystem: pub
    directory: /app
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(app)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(ci)
