<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Assinatura — PandaVip</title>
<style>
  :root {
    color-scheme: light dark;
    --fundo: #fbfaf8;
    --tinta: #171310;
    --tinta-2: #5c554e;
    --marca: #c25a0d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fundo: #131211;
      --tinta: #f2eee9;
      --tinta-2: #a8a099;
      --marca: #ffa25c;
    }
  }
  body {
    background: var(--fundo);
    color: var(--tinta);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.65;
    max-width: 32rem;
    margin: 0 auto;
    padding: 64px 20px 80px;
    text-align: center;
  }
  h1 { font-size: 1.6rem; line-height: 1.2; margin: 0 0 12px; }
  p { color: var(--tinta-2); }
  strong { color: var(--marca); }
</style>
</head>
<body>

<h1>Pronto, pode voltar ao app</h1>

<p>Se você concluiu o pagamento, sua assinatura aparece no <strong>PandaVip</strong>
assim que o Mercado Pago confirmar. Normalmente leva poucos minutos.</p>

<p>Se desistiu no meio, nada foi cobrado. Dá pra assinar de novo pelo app
quando quiser.</p>

</body>
</html>
