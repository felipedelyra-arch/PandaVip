<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Clube de vantagens do Tio Panda: pontos, cupons e recompensas.">

  <!--
    ⚠️ NADA de código dentro desta página.

    O Firebase Hosting serve `Content-Security-Policy: script-src 'self'` neste
    domínio (ver firebase/firebase.json). Sob essa política o navegador ignora
    <script> inline e atributos de evento (onclick=, onerror=) — sem erro
    visível, simplesmente não executa. Todo script vive em arquivo próprio,
    servido do mesmo domínio: panda-boot.js.

    O CSP é o que impede que texto vindo do banco (nome de prato, título de
    promoção) vire script executado no navegador do sócio.
  -->

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PandaVip">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PandaVip — Tio Panda</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="panda-splash.css">
</head>
<body>
  <div id="panda-splash">
    <img id="panda-splash-logo" src="assets/assets/logo/panda_logo.png" alt="PandaVip"/>
    <div class="t">PandaVip</div>
    <div class="s"></div>
  </div>
  <script src="panda-boot.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
